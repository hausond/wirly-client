# cargo-deny: лицензии, advisories, запреты.
# Политика: только разрешённые лицензии, никаких GPL/AGPL, только crates.io.

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "0BSD",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
  { name = "openssl", reason = "используем rustls/boring; OpenSSL тянет системные зависимости" },
  { name = "openssl-sys", reason = "см. openssl" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
