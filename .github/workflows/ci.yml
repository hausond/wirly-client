name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: fmt
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features
      - name: lockfile is up to date
        run: cargo metadata --locked --format-version 1 | Out-Null

  coverage:
    name: coverage
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: 100% line coverage for library crates
        run: >
          cargo llvm-cov --workspace
          --exclude vpn-service --exclude vpn-desktop
          --fail-under-lines 100
          --lcov --output-path lcov.info
      - name: coverage summary
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path lcov.info)) { Write-Host "lcov.info not found"; exit 0 }
          $lf = 0; $lh = 0; $file = $null; $missed = @()
          foreach ($line in Get-Content lcov.info) {
            $line = $line.Trim()
            if ($line -match '^SF:(.+)$') { $file = $Matches[1] }
            elseif ($line -match '^LF:(\d+)') { $lf += [int]$Matches[1] }
            elseif ($line -match '^LH:(\d+)') { $lh += [int]$Matches[1] }
            elseif ($line -match '^DA:(\d+),0$') { $missed += "$file`:$($Matches[1])" }
          }
          $pct = if ($lf -gt 0) { [math]::Round(100.0 * $lh / $lf, 2) } else { 0 }
          Write-Host "coverage: $lh / $lf lines = $pct%"
          Write-Host "uncovered lines (first 80):"
          $missed | Select-Object -First 80
          "coverage=$pct%" | Out-File -FilePath coverage-summary.txt -Encoding utf8
      - name: uncovered lines (text report)
        if: failure()
        shell: pwsh
        run: |
          cargo llvm-cov report --text > cov.txt
          Get-Content cov.txt | Select-String -Pattern '\|\s*0\|' | Select-Object -First 40
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            lcov.info
            coverage-summary.txt
            cov.txt
          if-no-files-found: warn

  docs:
    name: docs
    runs-on: windows-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  audit:
    name: audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  msrv:
    name: msrv
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: install MSRV toolchain
        run: rustup toolchain install 1.89.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: check on MSRV
        run: cargo +1.89.0 check --workspace
