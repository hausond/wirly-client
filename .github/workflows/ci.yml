name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: fmt
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features
      - name: lockfile is up to date
        run: cargo metadata --locked --format-version 1 | Out-Null

  coverage:
    name: coverage
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: 100% line coverage per crate
        shell: pwsh
        run: |
          $failed = @()
          foreach ($p in @('vpn-config','vpn-routing','vpn-dns','vpn-core','vpn-proto','vpn-tun')) {
            Write-Host "==> $p"
            cargo llvm-cov -p $p --fail-under-lines 100
            if ($LASTEXITCODE -ne 0) { $failed += $p }
          }
          if ($failed.Count -gt 0) {
            Write-Host "FAILED: $($failed -join ', ')"
            exit 1
          }

  docs:
    name: docs
    runs-on: windows-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  audit:
    name: audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  msrv:
    name: msrv
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: install MSRV toolchain
        run: rustup toolchain install 1.89.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: check on MSRV
        run: cargo +1.89.0 check --workspace
